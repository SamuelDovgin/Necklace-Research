<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File preview · Jewelry Research Hub</title>
    <link rel="icon" href="necklace-rfq-package/dashboard/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="markdown-viewer.css">
    <link rel="stylesheet" href="file-preview.css">
  </head>
  <body>
    <header class="viewer-header preview-header">
      <a id="backLink" class="back-link" href="./">← Research hub</a>
      <div class="viewer-actions">
        <a id="openPdf" target="_blank" rel="noopener" hidden>Open PDF in a new tab</a>
        <a id="downloadFile" download hidden>Download original</a>
      </div>
    </header>
    <main class="preview-main">
      <h1 id="previewTitle">File preview</h1>
      <p id="previewStatus" role="status">Loading file…</p>
      <section id="sheetPreview" aria-label="Table preview" hidden>
        <div class="sheet-controls">
          <label id="sheetPicker" hidden>Worksheet <select id="sheetSelect"></select></label>
          <label>Search rows <input id="rowSearch" type="search" placeholder="Search this table"></label>
        </div>
        <div class="sheet-scroll" role="region" aria-label="Scrollable table" tabindex="0">
          <table id="sheetTable"></table>
        </div>
        <div class="sheet-pages">
          <button id="previousPage" type="button">Previous</button>
          <output id="rowCount" for="rowSearch sheetSelect" aria-live="polite"></output>
          <button id="nextPage" type="button">Next</button>
        </div>
      </section>
      <div id="fileContent"></div>
      <noscript>Enable JavaScript to preview archive files.</noscript>
    </main>
    <script src="site-router.js"></script>
    <script src="file-preview-links.js"></script>
    <script src="file-preview.js"></script>
  </body>
</html>
